name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ Go inside your project folder
      - name: Debug root
        run: |
          pwd
          ls -la

      - name: Debug project folder
        run: |
          ls -la Adminpanel-backend--main

      # ✅ Build JAR in correct folder
      - name: Build JAR
        run: mvn clean package -DskipTests
        working-directory: Adminpanel-backend--main

      # ✅ Confirm JAR exists
      - name: Debug target folder
        run: |
          ls -la target
        working-directory: Adminpanel-backend--main

      # ✅ Docker login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ✅ Build Docker Image from correct folder
      - name: Build Image
        run: docker build -t mohitjava/superme:latest .
        working-directory: Adminpanel-backend--main

      # ✅ Push Image
      - name: Push Image
        run: docker push mohitjava/superme:latest

      # ✅ Deploy to server
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull mohitjava/superme:latest
            docker stop superme || true
            docker rm superme || true
            docker run -d -p 8080:8080 --name superme mohitjava/superme:latest